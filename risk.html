<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tina Seelig 六大領域風險承受度評估工具</title>
    <!-- 引入 Chart.js 用於繪製蜘蛛圖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .dimension-section {
            margin-bottom: 35px;
            border-left: 5px solid var(--primary-color);
            padding-left: 15px;
        }

        .dimension-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .question-card {
            background: #fbfbfb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }

        .question-text {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .options-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .option-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            cursor: pointer;
            font-size: 0.85rem;
            color: #555;
        }

        .option-label input {
            margin-bottom: 5px;
        }

        .scale-text {
            font-size: 0.8rem;
            color: #999;
            font-weight: normal;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 30px;
        }

        .btn-submit:hover {
            background-color: #34495e;
        }

        #result-section {
            display: none;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #ccc;
        }

        .chart-container {
            position: relative;
            margin: auto;
            height: 400px;
            width: 100%;
            max-width: 500px;
        }

        .analysis-box {
            margin-top: 25px;
            padding: 24px;
            background: #f1f2f6;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
        }

        .analysis-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .low-score-card {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .low-score-tag {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }

        .warm-quote {
            margin-top: 25px;
            font-style: italic;
            color: #555;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #2ecc71;
        }

        @media (max-width: 600px) {
            .options-group {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .option-label {
                flex: unset;
                width: 18%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>六大領域風險承受度評估</h1>
    <p class="intro">本測驗源自史丹佛博士 Tina Seelig 的幸運技能架構。<br>請根據你的真實直覺勾選（1分：極度抗拒/恐懼，5分：完全樂意/享受）。</p>
    
    <form id="quiz-form">
        <!-- 題目將由 JavaScript 自動生成 -->
        <div id="questions-container"></div>
        <button type="button" class="btn-submit" onclick="calculateResults()">生成我的風險蜘蛛圖</button>
    </form>

    <div id="result-section">
        <h2 style="text-align: center; color: var(--primary-color);">您的風險承受度分析結果</h2>
        <div class="chart-container">
            <canvas id="riskChart"></canvas>
        </div>
        <div id="analysis-output" class="analysis-box"></div>
    </div>
</div>

<script>
    // 30道題目與維度數據結構
    const quizData = [
        {
            dimension: "生理風險 (Physical)",
            subtext: "我害怕受傷、生病或失去身體的掌控權。",
            actions: [
                "改變一條通勤路線：下班時故意提早一站下車，走一條從沒走過的巷子回家。",
                "點一道沒吃過的菜：去平常最常去的餐廳，閉著眼睛點一個你過去「絕對不碰」的品項（例如：苦瓜、冷門辛香料）。",
                "微幅調整身體習慣：洗澡最後 10 秒鐘嘗試切換成冷水，體驗身體受到微小刺激的反應。"
            ],
            questions: [
                "嘗試高空彈跳、滑翔翼或衝浪等具有速度感與高度的極限運動。",
                "在沒有專業嚮導、只有地圖的情況下，去挑戰一條難度稍高的未知登山步道。",
                "嘗試從未吃過、外觀奇特或味道強烈的異國在地街頭小吃。",
                "在安全措施完善的前提下，體驗密室逃脫中的高空攀爬或黑暗幽閉關卡。",
                "放棄舒適的飯店，選擇到完全沒有網路訊號的深山野營一晚。"
            ]
        },
        {
            dimension: "情緒風險 (Emotional)",
            subtext: "我害怕展現脆弱會被拋棄、被拒絕，或是受傷。",
            actions: [
                "練習無痛拒絕：面對同事或朋友無關緊要的小邀約，練習說：「謝謝你，但我今天想留點時間給自己。」",
                "讚美他人：傳一則訊息給朋友，具體稱讚他最近做的某件小事，不帶任何目的。",
                "主動講述一件糗事：在吃午餐時，主動跟同事分享自己一件無傷大雅的愚蠢糗事，練習「自嘲」並發現世界其實沒有崩塌。"
            ],
            questions: [
                "面對心儀對象時，主動跨出第一步向對方告白，並承擔被拒絕的可能。",
                "在親近的朋友或伴侶面前，主動坦承自己內心深處的自卑、脆弱或恐懼。",
                "當發現一段關係（友誼或戀情）已經不健康且無法修補時，主動提出結束關係。",
                "在關係中發生衝突時，不冷戰、不討好，而是直接且誠實地表達自己受傷的感受。",
                "面對別人的讚美或批評時，能夠坦然接受，不急著否定自己或過度自我防衛。"
            ]
        },
        {
            dimension: "社會風險 (Social)",
            subtext: "我害怕在人群面前出醜、被評判，或者被貼上標籤。",
            actions: [
                "與店員微互動：在超商結帳時，看著店員的眼睛，真心說一句「謝謝你，辛苦了」。",
                "在線上發表一個貼圖：在公司大群組或百人社群裡，不發文字，只在別人發布好消息時按一個「🎉」或「👍」。",
                "開會時提早發言：在下一次會議中，在開場前 5 分鐘，第一個舉手說：「早安，我想確認一下今天的會議議程。」（講一句話就收工）。"
            ],
            questions: [
                "在超過 50 人的大型會議或公開場合上，站上講台發表觀點或進行演講。",
                "獨自參加一個完全沒有熟人的社交派對或產業聚會，並主動跟陌生人攀談。",
                "當眾人都在熱烈討論某個主流話題時，主動提出一個完全相反且非主流的個人見解。",
                "在路上或公共場合遇到需要協助的陌生人，能毫不猶豫地主動上前搭話並提供幫忙。",
                "在社交場合中，即使出糗或講錯話，也能自嘲一笑置之，不會耿耿於懷。"
            ]
        },
        {
            dimension: "財務風險 (Financial)",
            subtext: "金錢帶給我極大的安全感，我很害怕失去對物質的控制。",
            actions: [
                "設立一個「無痛虧損帳戶」：每個月拿出一筆就算丟到海裡也不心疼的錢（例如 500 元），去買你完全不懂但好奇的零股，練習看著它漲跌而心跳不加速。",
                "買一樣「平時捨不得買」的小物：故意去買一盒比平常貴一倍的精品水果，或是好一點的濾掛咖啡，打破「我配不上」的限制。",
                "嘗試物資流動：把家裡用不到的舊東西，上架拍賣網站便宜賣，體驗「資產流動與價值重估」的感覺。"
            ],
            questions: [
                "為了實踐更想做的事，在還沒有找到下一份工作前，就毅然決然辭掉穩定的現職。",
                "將自己大筆的積蓄投入高波動的投資市場（如股票、加密貨幣），而非放在安全的定存。",
                "拒絕拿固定的死薪水，選擇完全依照業績表現拿獎金的業務性質工作。",
                "拿出一筆會影響現有生活品質的資金，去支持朋友創業，或自己嘗試微型創業。",
                "在購買高單價物品或做重大財務決策時，願意「先買下再想辦法賺回來」，而非反覆糾結。"
            ]
        },
        {
            dimension: "智力風險 (Intellectual)",
            subtext: "我習慣在熟悉的領域當專家，我很害怕暴露出自己『不懂、很笨』的樣子。",
            actions: [
                "主動說不知道：在對話中只要別人聊到你沒聽過的名詞，立刻說：「這個我沒聽過耶，那是什麼？可以跟我說說嗎？」",
                "看一本完全相左的書：如果你討厭心靈雞湯，故意去翻一章吸引力法則；如果你支持科學，故意去讀一章玄學，練習「只觀察、不評判」的大腦彈性。",
                "下載一個全新的領域 App：隨便下載一個你這輩子絕對不會用的奇葩軟體（例如鳥類辨識軟體、天文觀測軟體），摸索玩個 10 分鐘。"
            ],
            questions: [
                "在專業領域的會議中，當著所有專家或同事的面，坦然承認「這題我不懂，請教導我」。",
                "放棄已經駕輕就熟的專業，重新投入一個完全陌生、可能讓你顯得像個白痴的全新學科。",
                "在腦力激盪會議中，提出一個聽起來極度瘋狂、不切實際，但很有創意的點子。",
                "閱讀與自己核心價值觀完全相反、甚至會讓你感到強烈不適的書籍或言論。",
                "挑戰一項全公司或全團隊都沒人做過、沒有任何前例可循的複雜系統或專案。"
            ]
        },
        {
            dimension: "政治風險 (Political)",
            subtext: "我害怕得罪權威、害怕團體的不和諧，更害怕被排擠與孤立。",
            actions: [
                "在小事上當和平打破者：同事問「中午吃什麼」當大家都說隨便時，你第一個說：「我想吃那家新開的拉麵店。」練習主導小集體的意志。",
                "私下提出不同意見：不需要當眾挑戰。開完會後，私下傳訊息給主管：「經理，關於剛才的方案，我想到另一個微調方向，或許可以降低風險，給您參考。」",
                "練習禮貌的「不附和」：當社交圈在集體八卦或抱怨某人時，選擇保持微笑不參與點頭，拿回你的政治主權。"
            ],
            questions: [
                "當高階主管或老闆提出一個顯然有邏輯漏洞的決策時，當眾提出質疑或修正建議。",
                "在職場上目睹不公不義的事情（如同事被集體排擠或搶功勞）時，主動站出來發聲捍衛。",
                "為了堅持做對的事，不惜得罪其他部門的主管，甚至面臨被跨部門抵制的風險。",
                "當團隊意見高度一致，而你持反對意見時，願意承擔「破壞和諧」的標籤，堅持發言。",
                "主動向公司申請調動到一個派系鬥爭激烈、或是資源分配合理度高度敏感的爭議部門。"
            ]
        }
    ];

    // 動態渲染 HTML 題目
    const container = document.getElementById('questions-container');
    let qIndex = 1;

    quizData.forEach((dim, dIdx) => {
        const section = document.createElement('div');
        section.className = 'dimension-section';
        section.innerHTML = `<div class="dimension-title">${dim.dimension}</div>`;

        dim.questions.forEach((qText) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-text">${qIndex}. ${qText}</div>
                <div class="options-group">
                    <span class="scale-text">極度抗拒</span>
                    ${[1, 2, 3, 4, 5].map(num => `
                        <label class="option-label">
                            <input type="radio" name="q${qIndex}" value="${num}" required>
                            ${num}
                        </label>
                    `).join('')}
                    <span class="scale-text">完全樂意</span>
                </div>
            `;
            section.appendChild(card);
            qIndex++;
        });
        container.appendChild(section);
    });

    let myChart = null;

    // 計算結果與繪圖
    function calculateResults() {
        const scores = [0, 0, 0, 0, 0, 0];
        let totalQuestions = 30;
        let answeredCount = 0;

        for (let i = 1; i <= totalQuestions; i++) {
            const radios = document.getElementsByName(`q${i}`);
            let checkedValue = null;
            for (const radio of radios) {
                if (radio.checked) {
                    checkedValue = parseInt(radio.value);
                    break;
                }
            }
            if (checkedValue !== null) {
                const dimIndex = Math.floor((i - 1) / 5);
                scores[dimIndex] += checkedValue;
                answeredCount++;
            }
        }

        if (answeredCount < totalQuestions) {
            alert(`您還有題目尚未填寫！目前已填寫 ${answeredCount} / ${totalQuestions} 題。`);
            return;
        }

        document.getElementById('result-section').style.display = 'block';

        const ctx = document.getElementById('riskChart').getContext('2d');
        const labels = quizData.map(d => d.dimension.split(' ')[0]);

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: '我的風險承受度 (滿分25分)',
                    data: scores,
                    backgroundColor: 'rgba(231, 76, 60, 0.2)',
                    borderColor: 'rgba(231, 76, 60, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(44, 62, 80, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { display: true },
                        suggestedMin: 5,
                        suggestedMax: 25,
                        ticks: { stepSize: 5 }
                    }
                }
            }
        });

        // 執行升級版分析診斷
        generateDeepAnalysis(scores);
        
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

    // 核心優化邏輯：抓出最低分的兩項進行深度心理拆解
    function generateDeepAnalysis(scores) {
        // 建立包含索引與分數的物件陣列
        let indexedScores = scores.map((score, index) => {
            return { index: index, score: score, data: quizData[index] };
        });

        // 依分數由低到高排序
        indexedScores.sort((a, b) => a.score - b.score);

        // 取出最低分的兩項
        const lowest1 = indexedScores[0];
        const lowest2 = indexedScores[1];

        const output = document.getElementById('analysis-output');
        
        let htmlContent = `
            <div class="analysis-title">🔍 您的好運體質與防禦重區深度洞察</div>
            <p>您的風險雷達圖已經生成。在 Tina Seelig 的幸運架構中，低分並不代表缺點，它往往是你為了保護自己而建立的城堡。但這也意味著，機會之風目前很難從這裡吹進來。</p>
            <p>系統自動診斷出您目前<strong>防禦機制最重、分數最低的兩個維度</strong>，請直面內心的真實狀態：</p>
        `;

        // 渲染最低分第一名
        htmlContent += `
            <div class="low-score-card">
                <span class="low-score-tag">防禦重區第一名：${lowest1.data.dimension} （${lowest1.score}分）</span>
                <p><strong>🧠 內心底層的心理潛台詞：</strong><br><span style="color: var(--accent-color); font-weight:500;">「${lowest1.data.subtext}」</span></p>
                <p><strong>💡 攪動能量的小步調整行動（三選一）：</strong></p>
                <ul>
                    ${lowest1.data.actions.map(act => `<li>${act}</li>`).join('')}
                </ul>
            </div>
        `;

        // 渲染最低分第二名
        htmlContent += `
            <div class="low-score-card">
                <span class="low-score-tag" style="background-color: #f39c12;">防禦重區第二名：${lowest2.data.dimension} （${lowest2.score}分）</span>
                <p><strong>🧠 內心底層的心理潛台詞：</strong><br><span style="color: #f39c12; font-weight:500;">「${lowest2.data.subtext}」</span></p>
                <p><strong>💡 攪動能量的小步調整行動（三選一）：</strong></p>
                <ul>
                    ${lowest2.data.actions.map(act => `<li>${act}</li>`).join('')}
                </ul>
            </div>
        `;

        // 結尾溫暖語錄
        htmlContent += `
            <div class="warm-quote">
                <strong>💡 主持人送給你的話：</strong><br>
                「低分只是你過去高耗能保存能量的保護殼。你不需要強迫自己一夜之間變得無所畏懼，更不需要把整座城堡炸掉。我們只需要輕輕地，把上面其中一個最無痛的小行動放進明天的生活裡，把窗戶推開五公分，去攪動這鍋湯。好運技能，就是從這群微小的回應選擇中，開始產生複利的。」
            </div>
        `;

        output.innerHTML = htmlContent;
    }
</script>

</body>
</html>
