<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心價值觀探索器</title>
    <style>
        /* --- 基礎設定 --- */
        :root { --primary: #4a90e2; --bg: #f5f7fa; --tooltip-bg: rgba(44, 62, 80, 0.95); }
        body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; color: #333; }
        .container { max-width: 1000px; width: 100%; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 80vh; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; line-height: 1.6; }
        
        /* --- 按鈕樣式 --- */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-size: 16px; margin: 30px auto; display: block; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3); }
        .btn:hover { transform: translateY(-2px); background-color: #357abd; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* --- 步驟 1: 選單網格 & Tooltip --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-bottom: 20px; }
        
        .card { 
            border: 2px solid #edf2f7; 
            background: white;
            padding: 15px 10px; 
            text-align: center; 
            cursor: pointer; 
            border-radius: 10px; 
            transition: all 0.2s;
            position: relative; /* 為了讓 Tooltip 定位 */
            font-weight: 500;
            user-select: none;
        }
        
        .card:hover { border-color: #cbd5e0; background: #f8fafc; }
        .card.selected { background: #ebf8ff; border-color: var(--primary); color: var(--primary); font-weight: bold; box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }

        /* Tooltip 本體 */
        .card .tooltip {
            visibility: hidden;
            width: 200px;
            background-color: var(--tooltip-bg);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            
            /* 定位設定 */
            position: absolute;
            z-index: 10;
            bottom: 115%; /* 顯示在卡片上方 */
            left: 50%;
            transform: translateX(-50%); /* 水平置中 */
            
            /* 動畫效果 */
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            font-size: 0.85rem;
            line-height: 1.4;
            pointer-events: none; /* 讓滑鼠點擊穿透 Tooltip，直接點到卡片 */
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Tooltip 的小箭頭 */
        .card .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }

        /* 滑鼠移上去時顯示 */
        .card:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }
        
        /* --- 步驟 2: PK 區域 --- */
        .pk-box { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        @media(min-width: 768px) { .pk-box { flex-direction: row; } }

        .pk-card { 
            flex: 1; 
            border: 2px solid #edf2f7; 
            padding: 30px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s; 
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .pk-card:hover { border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: translateY(-3px); }
        .pk-card h2 { color: var(--primary); margin-top: 0; }
        .pk-card p { font-size: 1.1em; color: #555; min-height: 3em;}
        .scenario { background: #fff5f5; color: #c0392b; padding: 15px; border-radius: 8px; margin-top: 15px; font-style: italic; line-height: 1.5; }

        /* --- 結果頁 --- */
        .result-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; background: white; }
        .result-item:first-child { background: linear-gradient(to right, #fffdf0, white); border-left: 4px solid gold; }
        .rank { font-weight: bold; margin-right: 20px; color: #bdc3c7; font-size: 1.5em; width: 40px; text-align: center; }
        .result-item:nth-child(1) .rank { color: gold; }
        .result-item:nth-child(2) .rank { color: silver; }
        .result-item:nth-child(3) .rank { color: #cd7f32; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h2 style="color:red; text-align:center;">程式載入中...</h2>
    </div>

    <script>
        // --- 1. 完整 60 個價值觀資料庫 ---
        const valuesData = [
            // I. 內在驅動力
            {name: "成就感", desc: "達成困難目標，獲得勝任感", scenario: "獲得業界最高榮譽獎項，被公認為該領域的頂尖專家。"},
            {name: "創造力", desc: "發想新點子，創造新事物", scenario: "你創作出了一件跨時代的藝術作品，徹底改變了人們的審美觀。"},
            {name: "學習成長", desc: "持續獲取新知識與技能", scenario: "你被賦予無限的學習資源，能夠掌握世界上所有的知識體系。"},
            {name: "獨立性", desc: "自主決定方向，不受干涉", scenario: "你擁有完全的決策權，可以自由選擇工作的時間、地點與方式。"},
            {name: "自由", desc: "享有不受限制的選擇權", scenario: "你可以隨時說走就走，世界上沒有任何規矩能約束你的行動。"},
            {name: "挑戰性", desc: "樂於接受困難任務", scenario: "你面前是一個看似不可能完成的專案，但成功將會帶來巨大的個人突破。"},
            {name: "知識智慧", desc: "追求真理與深刻理解", scenario: "你擁有看透事物本質的智慧，能為世人提供清晰的指引。"},
            {name: "自我提升", desc: "精進品格與習慣", scenario: "每天都能感覺到自己在進步，並且將一個壞習慣成功轉化為正向力量。"},
            {name: "熱情", desc: "對事物充滿強烈興趣", scenario: "你的工作就是你最大的興趣，讓你每天都能充滿幹勁、樂此不疲。"},
            {name: "獨特性", desc: "展現與眾不同的特質", scenario: "你的個人風格獨樹一幟，無需追隨潮流，反而成為他人的榜樣。"},
            
            // II. 人際關係
            {name: "家庭親密", desc: "與家人的深厚連結", scenario: "每天都能與家人共度高品質的晚餐時光，關係緊密無間。"},
            {name: "愛", desc: "給予與接受無條件的愛", scenario: "你擁有一份靈魂伴侶般的愛情，彼此理解、支持且永不分離。"},
            {name: "同理心", desc: "理解並分享他人感受", scenario: "你總是能準確感受到朋友的痛苦，並提供最貼心的支持與安慰。"},
            {name: "社群連結", desc: "參與群體並獲得歸屬感", scenario: "你所在的小鎮居民彼此互助，你感覺自己是這個大家庭中重要的一份子。"},
            {name: "友誼", desc: "長久且信任的朋友關係", scenario: "你有一群可以兩肋插刀的摯友，你們一起度過了所有的困難時刻。"},
            {name: "合作", desc: "與他人共同努力達成目標", scenario: "你參與的團隊總是能高效合作，每個人的能力都被完美結合。"},
            {name: "信任", desc: "互信互賴的安全環境", scenario: "你所處的環境中沒有謊言和背叛，所有人都對彼此開誠布公。"},
            {name: "尊重", desc: "重視他人價值，平等對待", scenario: "無論你的社會地位如何，所有人都發自內心地尊重你的意見與存在。"},
            {name: "奉獻", desc: "投入資源幫助他人", scenario: "你將自己的時間用於照顧弱勢群體，並親眼看到他們的生活因你而改善。"},
            {name: "寬恕", desc: "放下過去的傷害與怨恨", scenario: "你選擇放下多年前對你造成傷害的人，從而獲得了真正的內心釋放。"},

            // III. 道德與內心
            {name: "誠實正直", desc: "堅守道德，言行一致", scenario: "發現了公司的一個重大錯誤，即使會導致自己被解僱，仍決定公開真相。"},
            {name: "內心平靜", desc: "無焦慮的安詳狀態", scenario: "無論世界發生什麼事，你都能保持絕對的內心平靜，心如止水。"},
            {name: "可靠性", desc: "信守承諾，值得依賴", scenario: "所有人都知道，只要交給你處理的事情，就一定會被完美準時地完成。"},
            {name: "謙遜", desc: "不驕傲，保持開放態度", scenario: "即使你取得了巨大的成就，你仍然保持低調，並將功勞歸於團隊。"},
            {name: "紀律", desc: "自我控制，堅持目標", scenario: "你為自己設定了長期目標，並能不受外界干擾地每天堅持執行。"},
            {name: "幽默感", desc: "樂觀面對，緩解緊張", scenario: "你總是能用幽默化解尷尬的社交場合，讓周圍的人感到放鬆和快樂。"},
            {name: "韌性", desc: "從逆境中快速恢復", scenario: "你經歷了人生最大的低谷，但只用了很短的時間就重新站了起來。"},
            {name: "正義", desc: "維護公平與道德平衡", scenario: "你參與了一場為社會弱勢爭取權益的運動，最終成功改變了不公正的制度。"},
            {name: "樂觀", desc: "對未來抱持希望", scenario: "無論情況多糟，你始終能看到光明的一面，並且激勵周圍的人。"},
            {name: "感恩", desc: "珍惜所有，表達謝意", scenario: "你每天都對生活中的小確幸感到滿足，並且總是能發自內心地感謝他人。"},

            // IV. 外在與生活
            {name: "財富/富足", desc: "擁有充裕的金錢資源", scenario: "你擁有巨額財產，可以隨時購買任何想要的奢侈品，並享受頂級生活。"},
            {name: "安全感", desc: "生活穩定，免於恐懼", scenario: "你擁有絕對穩定的工作和居住環境，永遠不用擔心失業或意外風險。"},
            {name: "美感", desc: "追求和諧與藝術性", scenario: "你所處的環境總是充滿設計感和藝術品，每天都能被美麗的事物環繞。"},
            {name: "舒適性", desc: "輕鬆便利的物質生活", scenario: "你的生活設備總是頂級且全自動化，讓你無需費力就能享受最舒適的體驗。"},
            {name: "冒險探索", desc: "嘗試新事物，探索未知", scenario: "你一直在探索未開發的地域，每天都會面對新的文化和挑戰。"},
            {name: "健康", desc: "身心強健，充滿活力", scenario: "你的體能和精力遠超同齡人，能夠應付任何高強度的工作或旅行。"},
            {name: "聲譽地位", desc: "受人尊重的名望與階層", scenario: "你是公認的社會名流，你的名字和事蹟被寫進了教科書。"},
            {name: "效率", desc: "以最少資源做最多事", scenario: "你擁有極致的工作效率，能在別人花一週的時間內完成一個月的任務。"},
            {name: "環境保護", desc: "保護自然與生態", scenario: "你發起了一場成功的環境運動，讓一個被污染的地區恢復了生機。"},
            {name: "便利性", desc: "輕鬆快速取得所需", scenario: "你所有的需求都能透過簡單的科技指令瞬間得到滿足。"},

            // V. 平衡與其他
            {name: "生活平衡", desc: "兼顧工作與個人生活", scenario: "你既能獲得事業上的成功，又能保證每天有充足的時間陪伴家人。"},
            {name: "簡單性", desc: "生活簡約，去除複雜", scenario: "你的生活沒有多餘的物質負擔或複雜的人際關係，一切都清晰且簡單。"},
            {name: "靈性/冥想", desc: "追求超越物質的意義", scenario: "你找到了人生的終極意義，心靈上達到了前所未有的覺醒與平靜。"},
            {name: "樂趣", desc: "享受當下的快樂", scenario: "你每天都會找到讓自己發自內心歡笑的事物，生活充滿了精彩的體驗。"},
            {name: "刺激", desc: "追求感官興奮", scenario: "你總是沉浸在極限運動或充滿腎上腺素的挑戰中。"},
            {name: "責任感", desc: "肩負重任，影響他人", scenario: "你擔任了一個重要的職位，並成功地肩負起重大的責任，無人可以取代你。"},
            {name: "目標感", desc: "清晰的人生方向與使命", scenario: "你非常清楚自己的人生目標，每天醒來都知道自己正在為之奮鬥。"},
            {name: "慷慨", desc: "樂於分享資源", scenario: "你將大量的財產捐贈給慈善機構，並且看到這些幫助產生了巨大的漣漪效應。"},
            {name: "傳統", desc: "維護習俗與文化", scenario: "你被賦予了傳承家族或文化傳統的使命，並成功地將其延續到下一代。"},
            {name: "服務", desc: "透過行動幫助他人", scenario: "你的職業就是服務人群，每天都收到來自被你幫助的人的真誠感謝。"},
            {name: "預測性", desc: "有結構、可預期的生活", scenario: "你的生活井然有序，所有事情都按計畫進行，沒有任何突發意外。"},
            {name: "協調性", desc: "解決衝突，尋求平衡", scenario: "你總是在爭吵的兩方之間扮演和事佬，成功地解決了多年的爭端。"},
            {name: "實用性", desc: "重視實際功能與效益", scenario: "你所做的每個決定都以效益和結果為導向，絕不浪費資源在無用的事物上。"},
            {name: "多樣性", desc: "體驗不同，拒絕單調", scenario: "你每天都在從事不同性質的工作和活動，生活色彩斑斕、充滿變化。"},
            {name: "接納", desc: "無條件接受優缺點", scenario: "你完全接納了自己的所有不完美，也以同樣的心態對待身邊的人。"},
            {name: "專注", desc: "長時間集中注意力", scenario: "你在嘈雜的環境中也能保持高度專注，並在短時間內解決複雜問題。"},
            {name: "謙卑", desc: "保持敬畏之心", scenario: "即使你擁有很多，你依然覺得自己還有許多需要學習和成長的地方。"},
            {name: "透明度", desc: "公開清晰的資訊交流", scenario: "你所處的組織信息完全公開，沒有秘密或隱藏的議程。"},
            {name: "影響力", desc: "說服並領導他人", scenario: "在關鍵時刻，你總能說服所有人，讓群體走向你認為正確的方向。"},
            {name: "權力", desc: "掌控資源與決策", scenario: "你身居高位，你的一句話就能決定許多人的職業生涯或命運。"}
        ];

        // --- 2. 程式邏輯 ---
        let state = { selected: new Set(), resolveRef: null };
        const app = document.getElementById('app');

        // 階段一：海選 (加入 Tooltip 邏輯)
        function renderStep1() {
            app.innerHTML = `
                <h1>步驟 1/2: 初步篩選</h1>
                <p class="subtitle">請從下方勾選出您覺得重要的價值觀（建議 10-20 個）。<br>💡 <b>提示：滑鼠移到卡片上，可以看到詳細解釋。</b></p>
                <div class="grid">
                    ${valuesData.map((v, i) => `
                        <div class="card" id="c-${i}" onclick="toggle(${i})">
                            ${v.name}
                            <div class="tooltip">${v.desc}</div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn" id="goBtn" onclick="startSort()" disabled>開始精確排序 (已選 0 個)</button>
            `;
        }

        window.toggle = function(i) {
            const el = document.getElementById(`c-${i}`);
            if (state.selected.has(i)) {
                state.selected.delete(i);
                el.classList.remove('selected');
            } else {
                state.selected.add(i);
                el.classList.add('selected');
            }
            const count = state.selected.size;
            const btn = document.getElementById('goBtn');
            btn.innerText = `開始精確排序 (已選 ${count} 個)`;
            
            // 至少選 2 個才能開始比較
            if (count >= 2) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        // 階段二：排序 (Merge Sort)
        window.startSort = async function() {
            const items = Array.from(state.selected).map(i => valuesData[i]);
            app.innerHTML = `<h1>正在準備您的價值觀 PK 擂台...</h1>`;
            
            // 稍微延遲一下讓使用者有轉場感
            await new Promise(r => setTimeout(r, 500));
            
            const sorted = await mergeSort(items);
            renderResult(sorted);
        }

        async function mergeSort(arr) {
            if (arr.length <= 1) return arr;
            const mid = Math.floor(arr.length / 2);
            const left = await mergeSort(arr.slice(0, mid));
            const right = await mergeSort(arr.slice(mid));
            return await merge(left, right);
        }

        async function merge(left, right) {
            let res = [], i = 0, j = 0;
            while(i < left.length && j < right.length) {
                const pick = await promptUser(left[i], right[j]);
                if(pick === 'A') { res.push(left[i]); i++; }
                else { res.push(right[j]); j++; }
            }
            return [...res, ...left.slice(i), ...right.slice(j)];
        }

        function promptUser(a, b) {
            return new Promise(resolve => {
                // 每次比較都回到頂部
                window.scrollTo(0, 0);
                
                app.innerHTML = `
                    <h1>步驟 2/2: 價值觀 PK</h1>
                    <p class="subtitle">直覺二選一：這兩個情境，哪一個對你現在的生命 **更重要**？</p>
                    <div class="pk-box">
                        <div class="pk-card" onclick="resolveChoice('A')">
                            <h2>${a.name}</h2>
                            <p>${a.desc}</p>
                            <div class="scenario">情境：${a.scenario}</div>
                        </div>
                        <div class="pk-card" onclick="resolveChoice('B')">
                            <h2>${b.name}</h2>
                            <p>${b.desc}</p>
                            <div class="scenario">情境：${b.scenario}</div>
                        </div>
                    </div>
                `;
                state.resolveRef = resolve;
                window.resolveChoice = (choice) => { state.resolveRef(choice); };
            });
        }

        function renderResult(list) {
            window.scrollTo(0, 0);
            // 只取前 10 名，如果不足 10 個就顯示全部
            const topList = list.slice(0, 10);
            
            app.innerHTML = `
                <h1>🎉 您的核心價值觀排行榜</h1>
                <p class="subtitle">根據內心深處的選擇，這是對您最重要的排序結果：</p>
                <div>
                    ${topList.map((v, i) => `
                        <div class="result-item">
                            <span class="rank">${i+1}</span>
                            <div>
                                <strong style="font-size: 1.2em;">${v.name}</strong>
                                <div style="font-size:0.95em; color:#666; margin-top: 5px;">${v.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn" onclick="location.reload()">重新測試</button>
            `;
        }

        // 啟動程式
        renderStep1();
    </script>
</body>
</html>
